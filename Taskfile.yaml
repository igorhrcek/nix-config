version: "3"

vars:
  USERNAME:
    sh: whoami
  HOME_DIR: /Users/{{.USERNAME}}
  HOSTNAME:
    sh: scutil --get ComputerName 2>/dev/null || uname -n
  OS:
    sh: uname -s
  SECRETS_FILE: "{{.HOME}}/.config/fish/secrets.fish"
  OP: op
  SSH_CONFIG_FILE: "{{.HOME}}/.ssh/config"
  AGE_KEY_FILE: "{{.HOME}}/.config/sops/age/keys.txt"
  AGE_KEY_REF: "op://dybf7pkyrexvknx2p3mdhmanya/rsguk7qmlg2pufvtc7xyd2h6gi/password"

tasks:
  default:
    cmds:
      - task --list
    desc: Show available tasks

  build:
    cmds:
      - |
        if [ "{{.OS}}" = "Darwin" ]; then
          echo "Building Nix-Darwin configuration..."
          nix build .#darwinConfigurations.{{.HOSTNAME}}.system
        else
          echo "Building Nix Home Manager configuration for Linux..."
          nix build .#homeConfigurations.linux.activationPackage
        fi
    desc: Build the configuration

  switch:
    cmds:
      - |
        set -e
        if [ "{{.OS}}" = "Darwin" ]; then
          echo "Switching to the new Nix-Darwin configuration..."
          sudo ./result/sw/bin/darwin-rebuild switch --flake .#{{.HOSTNAME}}
          /run/current-system/sw/bin/ml-record-applied
        else
          echo "Activating the new Home Manager configuration for Linux..."
          ./result/activate
        fi
    desc: Apply the new configuration and record the company release

  post-switch:
    cmds:
      - echo "Running post-switch tasks..."
      - task check-op-signin
      - task all-secrets
    desc: Manually generate secrets during initial setup

  check-op-signin:
    cmds:
      - |
        if ! {{.OP}} account get --format=json >/dev/null 2>&1; then
          echo "1Password is not signed in. Please sign in:"
          eval $({{.OP}} signin)
        else
          echo "1Password is already signed in."
        fi

  update:
    cmds:
      - echo "Updating flake.lock..."
      - nix flake update
    desc: Update the flake.lock file

  clean:
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -rf result
    desc: Clean build artifacts

  edit:
    cmds:
      - echo "Opening configuration files for editing..."
      - $EDITOR flake.nix
    desc: Edit the configuration

  status:
    cmds:
      - echo "Showing current Nix-Darwin and Home Manager status..."
      - sudo darwin-rebuild --dry-run
    desc: Show the current status

  update-mailerlite:
    cmds:
      - echo "Updating mailerlite flake input..."
      - nix flake update mailerlite
    desc: Update the mailerlite flake input

  darwin-refresh:
    cmds:
      - echo "Refreshing Nix-Darwin configuration..."
      - task: homebrew-trust
      - sudo darwin-rebuild switch --flake . --show-trace
      - /run/current-system/sw/bin/ml-record-applied
    desc: Refresh Nix-Darwin configuration

  homebrew-trust:
    internal: true
    cmds:
      - brew trust --formula ddev/ddev/ddev
      - brew trust vitobotta/hetzner_k3s

  universal-build:
    cmds:
      - task: build
      - task: switch
    desc: Build and apply the new configuration based on the OS

  company-build:
    platforms: [darwin]
    cmds:
      - task: update-mailerlite
      - task: build
      - task: homebrew-trust
      - task: switch
    desc: Update company input, build the combined configuration, and apply it

  setup-nix:
    cmds:
      - echo "Installing Nix package manager..."
      - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --no-confirm
    desc: Install Nix package manager

  all-secrets:
    deps:
      [
        generate-secrets,
        generate-ssh-config,
        generate-age-key,
      ]

  generate-secrets:
    cmds:
      - echo "Generating secrets..."
      - mkdir -p $(dirname {{.SECRETS_FILE}})
      - |
        cat > {{.SECRETS_FILE}} << EOF
        # Generated secrets - Do not edit manually

        set -gx GITHUB_TOKEN "$({{.OP}} read 'op://dybf7pkyrexvknx2p3mdhmanya/xzangrgv7vsl5ybsunczgthizi/credential' --account AOLECYMKWVC53BBIB5CMKJTUKE)"
        EOF
      - echo "Secrets generated in {{.SECRETS_FILE}}"

  generate-ssh-config:
    cmds:
      - echo "Generating SSH config..."
      - mkdir -p $(dirname {{.SSH_CONFIG_FILE}})
      - "{{.OP}} read 'op://dybf7pkyrexvknx2p3mdhmanya/r2nju2cm7xpbyefvpqwvhbo5xy/notesPlain' --account AOLECYMKWVC53BBIB5CMKJTUKE > {{.SSH_CONFIG_FILE}}"
      - echo "SSH config generated in {{.SSH_CONFIG_FILE}}"

  generate-atuin-key:
    cmds:
      - atuin login
    desc: Set up Atuin interactively (accepts a recovery phrase; never writes it directly to the key file)

  generate-age-key:
    cmds:
      - echo "Generating Age key..."
      - |
        set -eu
        mkdir -p "$(dirname "{{.AGE_KEY_FILE}}")"
        AGE_KEY_TEMP=$(mktemp "{{.AGE_KEY_FILE}}.XXXXXX")
        trap 'rm -f "$AGE_KEY_TEMP"' EXIT
        {{.OP}} read '{{.AGE_KEY_REF}}' --account AOLECYMKWVC53BBIB5CMKJTUKE > "$AGE_KEY_TEMP"
        test -s "$AGE_KEY_TEMP"
        mv "$AGE_KEY_TEMP" "{{.AGE_KEY_FILE}}"
      - echo "Age key generated in {{.AGE_KEY_FILE}}"

  install-fonts:
    cmds:
      - echo "Installing private fonts..."
      - |
        TEMP_DIR=$(mktemp -d)
        FONTS_DIR="{{.HOME_DIR}}/Library/Fonts"

        # Create fonts directory if it doesn't exist
        mkdir -p "$FONTS_DIR"

        # Fetch zip from 1Password and save to temp directory
        {{.OP}} read "op://dybf7pkyrexvknx2p3mdhmanya/ibobsjtfm32ohxjkwzpuvjvo3e/fonts.zip" --account AOLECYMKWVC53BBIB5CMKJTUKE --out-file="$TEMP_DIR/fonts.zip"

        # Unzip fonts
        unzip -q "$TEMP_DIR/fonts.zip" -d "$TEMP_DIR/fonts"

        # Copy all font files to user fonts directory
        cp "$TEMP_DIR"/fonts/*.{ttf,otf,TTF,OTF} "$FONTS_DIR/" 2>/dev/null || true

        # Cleanup
        rm -rf "$TEMP_DIR"

        echo "Fonts installed in $FONTS_DIR"
    desc: Install private fonts from 1Password
